name: Add automatic review comments
on:
  pull_request:
    types: [ready_for_review]
jobs:
  automatic-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check out shallow submodules
        run: git submodule update --init --depth 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.
            Use `git` commands to inspect the history of commits in the current PR
            and elsewhere in the repository as needed.
            Note that the submodules under `third-party/` are shallow clones by default,
            but you may fetch additional history if needed for your review.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.
          claude_args: |
            --model opus
            --max-budget-usd 10.00
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(git diff:*),Bash(git -C third-party/* fetch:*),Bash(git -C third-party/* log:*),Bash(git -C third-party/* show:*),Bash(git -C third-party/* blame:*),Bash(git -C third-party/* diff:*)"
